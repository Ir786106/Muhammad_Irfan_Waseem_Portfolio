name: Deploy new portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check && npm run lint && npm test
      - name: Build for Pages
        env:
          REPOSITORY: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          export SITE_URL="https://${OWNER}.github.io"
          export BASE_PATH="/${REPOSITORY}/"
          if [ "${REPOSITORY,,}" = "${OWNER,,}.github.io" ]; then export BASE_PATH="/"; fi
          npm run build
          node scripts/check-pages.mjs
      - name: Publish V4 homepage and assets
        run: cp -a site/. dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
